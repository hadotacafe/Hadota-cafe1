
name: Build Hadota APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          mkdir www
          cp index.html www/index.html
          npx cap init "Hadota cafe1" "com.hadota.cafe1" --web-dir=www
          npx cap add android
          npx cap sync android

          mkdir -p android/app/src/main/java/com/hadota/cafe1

          cat > android/app/src/main/java/com/hadota/cafe1/MainActivity.java <<'EOF'
          package com.hadota.cafe1;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WhatsAppPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cat > android/app/src/main/java/com/hadota/cafe1/WhatsAppPlugin.java <<'EOF'
          package com.hadota.cafe1;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "WhatsApp")
          public class WhatsAppPlugin extends Plugin {
              @PluginMethod
              public void share(PluginCall call) {
                  String text = call.getString("text", "");
                  Intent intent = new Intent(Intent.ACTION_SEND);
                  intent.setType("text/plain");
                  intent.setPackage("com.whatsapp");
                  intent.putExtra(Intent.EXTRA_TEXT, text);

                  try {
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (ActivityNotFoundException error) {
                      call.reject("واتساب العادي غير مثبت على الجهاز.");
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-cafe1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
