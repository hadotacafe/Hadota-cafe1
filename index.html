
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101715">
<title>Hadota cafe 1</title>
<style>
:root{--bg:#0d1311;--card:#171f1c;--ink:#edf3ef;--muted:#a1afa7;--green:#247a55;--gold:#d6a84f;--red:#ff7770;--line:#2b3932}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,Arial}
header{background:linear-gradient(135deg,#080e0c,#193d2d);padding:24px 18px;color:white;border-radius:0 0 22px 22px}
.brand{font-size:23px;font-weight:800}.sub{color:#c5d8cc;font-size:13px;margin-top:4px}
main{max-width:760px;margin:auto;padding:16px 13px 36px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat,.employee,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}
.stat{text-align:center}.stat strong{display:block;font-size:21px}.stat span,.hint,.status,.timer-label,.emp-meta,.note{color:var(--muted);font-size:11px}
.section-head,.emp-head,.timer-row,.report-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section-head{margin:20px 2px 10px}.section-head h2{font-size:17px}
.name-wrap{display:flex;align-items:center;gap:9px}.avatar{width:37px;height:37px;border-radius:12px;background:#203b2d;color:#8fe0b2;display:grid;place-items:center}
.name{font-weight:750}.employee-menu{position:relative}
.menu-trigger{border:0;background:#26332c;color:white;border-radius:10px;width:40px;height:38px;font-size:25px}
.menu-items{position:absolute;z-index:5;left:0;top:42px;min-width:145px;padding:6px;background:#202b25;border:1px solid #3b4b42;border-radius:11px;display:grid;gap:5px}
.menu-items[hidden]{display:none}
.edit{border:0;background:#26332c;color:#e2ebe5;border-radius:9px;padding:10px;text-align:right}
.timer-row{margin:13px 0 10px;padding:11px;background:#202a25;border-radius:12px}
.timer{font-size:27px;font-weight:800;direction:ltr}.timer.over{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:11px 6px;font-size:12px;font-weight:700}
.start,.primary{background:var(--green);color:white}.reset,.secondary{background:#29352e;color:#e0e9e3}
.collect{background:#45371d;color:#f4d58c}.collect.done{background:#1d3b2a;color:#a8e3b9}
.report-line{padding:8px 0;border-bottom:1px solid var(--line)}
.report-actions{display:flex;gap:8px;margin-top:12px}.report-actions button{flex:1}
.note{line-height:1.7}footer{text-align:center;color:#7f9086;padding:18px}
dialog{background:#1a2420;color:white;border:1px solid var(--line);border-radius:16px;width:90%;padding:18px}
dialog::backdrop{background:#000a}
input{background:#111a16;color:white;width:100%;padding:12px;border:1px solid #3a4a40;border-radius:10px}
@media(min-width:620px){.employees{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
</style>
</head>
<body>
<header><div class="brand">Hadota cafe 1</div><div class="sub">إدارة البريكات والتحصيل</div></header>
<main>
<div class="summary">
<div class="stat"><strong id="count">9</strong><span>عدد الموظفين</span></div>
<div class="stat"><strong id="active">0</strong><span>بريك شغال</span></div>
<div class="stat"><strong id="paid">0</strong><span>تحصيل اليوم (جنيه)</span></div>
</div>
<div class="section-head"><h2>الموظفون</h2><button class="btn start" id="addEmployee">+ إضافة موظف</button></div>
<div class="hint">الوقت المسموح: 60 دقيقة لكل موظف</div>
<div class="employees" id="employees"></div>
<div class="panel">
<h3>ملخص تحصيل اليوم</h3>
<div class="report-line"><span>عدد مرات التحصيل</span><strong id="payments">0</strong></div>
<div class="report-line"><span>إجمالي المبلغ المحصل</span><strong><span id="total">0</span> جنيه</strong></div>
<div class="report-line"><span>المتبقي</span><strong id="remaining">0 جنيه</strong></div>
<div class="report-actions"><button class="btn primary" id="share">مشاركة تقرير اليوم</button><button class="btn secondary" id="clear">تصفير تقرير اليوم</button></div>
<div class="report-actions"><button class="btn secondary" id="backup">تنزيل نسخة احتياطية</button><button class="btn secondary" id="restore">استعادة نسخة احتياطية</button></div>
<input id="restoreFile" type="file" accept="application/json" hidden>
</div>
</main>
<footer>Hadota cafe 1</footer>
<dialog id="editDialog"><h3>تعديل اسم الموظف</h3><input id="nameInput" maxlength="28"><div class="report-actions"><button class="btn primary" id="saveName">حفظ</button><button class="btn secondary" id="cancelName">إلغاء</button></div></dialog>
<script>
const KEY='hadota_cafe_1_demo_v1';
const defaultState={employees:Array.from({length:9},(_,i)=>({name:'موظف '+(i+1),seconds:0,running:false,startedAt:null,collected:false,overrunCharged:false})),payments:[],day:new Date().toLocaleDateString('en-CA')};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaultState}catch(e){state=defaultState}
function today(){return new Date().toLocaleDateString('en-CA')}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function elapsed(e){return e.seconds+(e.running&&e.startedAt?Math.floor((Date.now()-e.startedAt)/1000):0)}
function fmt(s){s=Math.max(0,s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')}
function rollover(){if(state.day!==today()){state.day=today();state.payments=[];state.employees.forEach(e=>{e.collected=false;e.overrunCharged=false});save()}}
function render(){
rollover();let root=document.getElementById('employees');root.innerHTML='';
state.employees.forEach((e,i)=>{
let sec=elapsed(e),over=sec>3600,card=document.createElement('section');card.className='employee';
card.innerHTML=`<div class="emp-head"><div class="name-wrap"><div class="avatar">${i+1}</div><div><div class="name"></div><div class="status">${e.running?'البريك شغال الآن':over?'تجاوز الوقت المسموح':'متاح'}</div></div></div><div class="employee-menu"><button class="menu-trigger" data-menu="${i}">⋮</button><div class="menu-items" data-menu-items="${i}" hidden><button class="edit" data-edit="${i}">تعديل الاسم</button><button class="edit" style="color:#ff8b84" data-delete="${i}">حذف الموظف</button></div></div></div>
<div class="timer-row"><div><div class="timer-label">وقت البريك</div><div class="timer ${over?'over':''}">${fmt(sec)}</div></div><div class="emp-meta">المسموح 01:00:00<br>${over?'تجاوز الوقت':'داخل الوقت'}</div></div>
<div class="actions"><button class="btn start" data-toggle="${i}">${e.running?'إيقاف البريك':'بدء البريك'}</button><button class="btn reset" data-reset="${i}">تصفير الوقت</button><button class="btn collect ${e.collected?'done':''}" data-collect="${i}">${e.collected?'تم التحصيل ✓':'تحصيل 50 جنيه'}</button><button class="btn secondary" data-share-employee="${i}">مشاركة الوقت والتأخير</button></div>`;
card.querySelector('.name').textContent=e.name;root.appendChild(card);
});
let active=state.employees.filter(e=>e.running).length,paid=state.payments.reduce((a,p)=>a+p.amount,0);
count.textContent=state.employees.length;document.getElementById('active').textContent=active;document.getElementById('paid').textContent=paid;payments.textContent=state.payments.length;total.textContent=paid;remaining.textContent='0 جنيه';
}
document.addEventListener('click',ev=>{
let t=ev.target;
if(t.dataset.menu!==undefined){let items=document.querySelector(`[data-menu-items="${t.dataset.menu}"]`),open=items.hidden;document.querySelectorAll('.menu-items').forEach(m=>m.hidden=true);items.hidden=!open;return}
if(!t.closest('.employee-menu'))document.querySelectorAll('.menu-items').forEach(m=>m.hidden=true);
if(t.dataset.toggle!==undefined){let e=state.employees[+t.dataset.toggle];if(e.running){e.seconds=elapsed(e);e.running=false;e.startedAt=null}else{e.running=true;e.startedAt=Date.now()}save();render()}
if(t.dataset.reset!==undefined){let e=state.employees[+t.dataset.reset];if(confirm('تصفير وقت البريك والتحصيل؟')){e.seconds=0;e.running=false;e.startedAt=null;e.overrunCharged=false;e.collected=false;state.payments=state.payments.filter(p=>p.name!==e.name);save();render()}}
if(t.dataset.collect!==undefined){let e=state.employees[+t.dataset.collect];if(!e.collected){e.collected=true;state.payments.push({name:e.name,amount:50,time:new Date().toISOString()});save();render()}else alert('تم التحصيل بالفعل اليوم')}
if(t.dataset.edit!==undefined){editing=+t.dataset.edit;nameInput.value=state.employees[editing].name;editDialog.showModal()}
if(t.dataset.delete!==undefined){let i=+t.dataset.delete;if(state.employees.length<=1)return alert('لازم يفضل موظف واحد');if(confirm('متأكد من حذف '+state.employees[i].name+'؟')){state.employees.splice(i,1);save();render()}}
if(t.dataset.shareEmployee!==undefined){let e=state.employees[+t.dataset.shareEmployee],s=elapsed(e),d=Math.max(0,s-3600);window.open('https://wa.me/?text='+encodeURIComponent('وقت البريك: '+fmt(s)+'\nوقت التأخير: '+fmt(d)),'_blank')}
});
document.getElementById('addEmployee').onclick=()=>{let n=prompt('اسم الموظف الجديد');if(n&&n.trim()){state.employees.push({name:n.trim(),seconds:0,running:false,startedAt:null,collected:false,overrunCharged:false});save();render()}};
let editing=0;
document.getElementById('saveName').onclick=()=>{let v=nameInput.value.trim();if(v)state.employees[editing].name=v;save();editDialog.close();render()};
document.getElementById('cancelName').onclick=()=>editDialog.close();
document.getElementById('share').onclick=()=>{let total=state.payments.reduce((a,p)=>a+p.amount,0);let msg='Hadota cafe 1\nالتاريخ: '+today()+'\nعدد الموظفين: '+state.employees.length+'\nإجمالي التحصيل: '+total+' جنيه\n'+state.employees.map(e=>e.name+' - '+fmt(elapsed(e))+' - '+(e.collected?'تم التحصيل':'لم يتم التحصيل')).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')};
document.getElementById('clear').onclick=()=>{if(confirm('تصفير تقرير اليوم؟')){state.payments=[];state.employees.forEach(e=>e.collected=false);save();render()}};
document.getElementById('backup').onclick=()=>{let b=new Blob([JSON.stringify({state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Hadota_backup.json';a.click();URL.revokeObjectURL(u)};
document.getElementById('restore').onclick=()=>restoreFile.click();
document.getElementById('restoreFile').onchange=async ev=>{try{let p=JSON.parse(await ev.target.files[0].text());state=p.state||p;if(!Array.isArray(state.employees)||!Array.isArray(state.payments))throw 0;save();render();alert('تمت الاستعادة')}catch(e){alert('ملف غير صالح')}};
render();setInterval(render,1000);
</script>
</body>
</html>
