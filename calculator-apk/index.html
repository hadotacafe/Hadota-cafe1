<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000"><title>الآلة الحاسبة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#f5f5f5;font-family:Roboto,"Arial",sans-serif;overflow:hidden}
.phone{height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column;background:#000}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;font-size:13px;direction:ltr;color:#eee;padding:0 5px}
.tools{height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#d7d7d7;font-size:25px}
.tool{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:transparent}
.display{flex:1;min-height:130px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 28px;direction:ltr;font-size:clamp(48px,11vw,68px);font-weight:300;overflow:hidden;white-space:nowrap;letter-spacing:-1.5px}
.grid{display:grid;direction:ltr;grid-template-columns:repeat(4,1fr);gap:clamp(11px,3vw,17px);padding:0 3px 20px}
.key{border:0;border-radius:50%;aspect-ratio:1;background:#252525;color:#f7f7f7;font-size:clamp(27px,7vw,42px);font-weight:400;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.key:active{filter:brightness(1.35)}
.op{background:#333;color:#f5f5f5}
.clear,.back{background:#333;color:#f2f2f2}
.equal{background:#16a765;color:#fff}
#vault{position:fixed;inset:0;background:#080808;padding:45px 22px 25px;display:none;overflow:auto}
.brand{text-align:center;margin:18px 0 30px}.brand b{color:#c9a45c;letter-spacing:2px}
h2{color:#d0b274}.sub,.note{color:#999;font-size:12px;line-height:1.8}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.app{background:#171717;border:1px solid #333;border-radius:16px;padding:15px 5px;text-align:center;min-height:100px}
.app .ico{font-size:28px}.app small{display:block;margin-top:8px}.app.selected{border-color:#c9a45c;background:#292216}
.lock{position:fixed;bottom:18px;left:20px;right:20px;background:#c9a45c;color:#17120a;border:0;border-radius:12px;padding:14px;font-weight:bold}
</style></head>
<body>
<main class="phone" id="calc">
<div class="status"><span>◉ ▮▮ 4G+ ◖</span><span>9:41</span></div>
<div class="tools"><span class="tool">◷</span><span class="tool">▱　▣</span></div>
<div class="display" id="display">0</div>
<div class="grid">
<button class="key clear" onclick="clearAll()">C</button><button class="key back" onclick="del()">⌫</button><button class="key op" onclick="put('%')">%</button><button class="key op" onclick="put('÷')">÷</button>
<button class="key" onclick="put('7')">7</button><button class="key" onclick="put('8')">8</button><button class="key" onclick="put('9')">9</button><button class="key op" onclick="put('×')">×</button>
<button class="key" onclick="put('4')">4</button><button class="key" onclick="put('5')">5</button><button class="key" onclick="put('6')">6</button><button class="key op" onclick="put('-')">−</button>
<button class="key" onclick="put('1')">1</button><button class="key" onclick="put('2')">2</button><button class="key" onclick="put('3')">3</button><button class="key op" onclick="put('+')">+</button>
<button class="key" onclick="put('(')">(</button><button class="key" onclick="put('0')">0</button><button class="key" onclick="put('.')">.</button><button class="key equal" onclick="equals()">=</button>
</div></main>
<section id="vault"><div class="brand"><b>HADOTA VAULT</b><p class="sub">خزنة ملفات مشفّرة على الجهاز</p></div><h2>الخزنة السرية</h2><p class="sub">افتح الخزنة بالبصمة، ثم أضف ملفاتك. الملفات تُشفّر داخل مساحة التطبيق.</p><div style="display:grid;gap:12px;margin-top:22px"><button class="lock" style="position:static" onclick="addFile()">＋ إضافة ملف وتشفيره</button><button class="lock" style="position:static;background:#333;color:#fff" onclick="refreshFiles()">تحديث الملفات</button></div><div id="files" style="margin-top:20px"></div><p class="note">التشفير AES-GCM ومفتاحه محفوظ في Android Keystore. حذف التطبيق أو بياناته قد يفقد الملفات نهائيًا؛ صدّر نسخة من ملفاتك المهمة.</p><button class="lock" onclick="lockVault()">قفل والعودة للآلة الحاسبة</button></section>
<script>
let value='';
function update(){document.getElementById('display').textContent=value||'0'}
function put(x){if(value==='خطأ')value='';value+=x;update()}
function clearAll(){value='';update()}
function del(){value=value.slice(0,-1);update()}
async function equals(){
 if(value==='1990'){value='';update();try{await authenticateVault();document.getElementById('calc').style.display='none';document.getElementById('vault').style.display='block';await refreshFiles()}catch(e){alert('لم يتم فتح الخزنة: '+(e.message||e))}return}
 try{let e=value.replaceAll('×','*').replaceAll('÷','/').replace(/[^0-9+\\-*\\/%().]/g,'');if(e)value=String(Function('"use strict";return ('+e+')')());update()}catch(e){value='خطأ';update()}
}
function vaultPlugin(){const p=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Vault;if(!p)throw new Error('خدمات الخزنة الأصلية غير موجودة في هذه النسخة');return p}
async function authenticateVault(){return await vaultPlugin().authenticate()}
async function addFile(){try{await authenticateVault();await vaultPlugin().pickAndEncrypt();alert('تم تشفير الملف وحفظه داخل الخزنة');await refreshFiles()}catch(e){alert('تعذر إضافة الملف: '+(e.message||e))}}
async function refreshFiles(){try{const r=await vaultPlugin().listFiles();const el=document.getElementById('files');el.innerHTML='';(r.files||[]).forEach(f=>{const row=document.createElement('div');row.style.cssText='background:#171717;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px';const label=document.createElement('span');label.textContent=f.id+' · '+Math.max(1,Math.round(f.size/1024))+' KB';const b=document.createElement('button');b.textContent='تصدير';b.style.cssText='padding:9px 12px;border:0;border-radius:8px;background:#c9a45c;color:#111';b.onclick=async()=>{try{await authenticateVault();await vaultPlugin().exportFile({id:f.id});alert('تم تصدير الملف بعد فك تشفيره')}catch(e){alert('فشل التصدير: '+(e.message||e))}};row.append(label,b);el.append(row)});if(!(r.files||[]).length)el.textContent='لا توجد ملفات محفوظة بعد.'}catch(e){document.getElementById('files').textContent='تعذر تحميل الملفات: '+(e.message||e)}}
function lockVault(){document.getElementById('vault').style.display='none';document.getElementById('calc').style.display='flex';clearAll()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&document.getElementById('vault').style.display==='block')lockVault()});
</script></body></html>
